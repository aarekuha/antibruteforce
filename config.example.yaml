http:
  listen_addr: ":8080" # ABF_HTTP_LISTEN_ADDR

postgres:
  addr: "localhost:5432" # ABF_POSTGRES_ADDR
  database: "antibruteforce" # ABF_POSTGRES_DATABASE
  user: "antibruteforce" # ABF_POSTGRES_USER
  password: "" # ABF_POSTGRES_PASSWORD

redis:
  addr: "localhost:6379" # ABF_REDIS_ADDR
  password: "" # ABF_REDIS_PASSWORD
  max_idle: 8 # ABF_REDIS_MAX_IDLE
  idle_timeout: 1m # ABF_REDIS_IDLE_TIMEOUT
  connect_timeout: 5s # ABF_REDIS_CONNECT_TIMEOUT
  read_timeout: 5s # ABF_REDIS_READ_TIMEOUT
  write_timeout: 5s # ABF_REDIS_WRITE_TIMEOUT

limits:
  login: 10 # ABF_LIMITS_LOGIN
  password: 100 # ABF_LIMITS_PASSWORD
  ip: 1000 # ABF_LIMITS_IP

hmac_secret: "" # ABF_HMAC_SECRET
